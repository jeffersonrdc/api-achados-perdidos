# Reverse proxy — API Rock in Rio (backend Spring Boot em container Docker)
# Deploy: /etc/nginx/sites-available/api-rockinrio.conf  (symlink em sites-enabled)
#   nginx -t && systemctl reload nginx
#
# Backend publicado em 127.0.0.1:8203 (HOST_PORT do container rockinrio-backend).
#
# IMPORTANTE — domínio com underscore:
#   "api_rockinrio.mastersdevs.com.br" tem "_", que o Tomcat REJEITA no header Host
#   (HTTP 400). Por isso enviamos ao upstream um Host válido (com hífen) e preservamos
#   o host original em X-Forwarded-Host. TLS é terminado no Cloudflare (edge HTTPS → origin HTTP).

server {
    listen 80;
    server_name api_rockinrio.mastersdevs.com.br;

    location / {
        proxy_pass http://127.0.0.1:8203;
        proxy_http_version 1.1;
        proxy_set_header Host              api-rockinrio.mastersdevs.com.br;  # Host válido p/ o Tomcat
        proxy_set_header X-Forwarded-Host  api-rockinrio.mastersdevs.com.br;  # host fixo (evita host-header injection)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }
}
