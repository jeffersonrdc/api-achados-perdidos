spring.application.name=api-achados-perdidos

spring.jackson.deserialization.fail-on-unknown-properties=true

server.port=8080
server.servlet.context-path=/

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:12MB}

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:achados_perdidos}?useSSL=false&serverTimezone=UTC&tinyInt1isBit=false}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

app.jwt.secret=${JWT_SECRET:chave-secreta-minimo-32-chars-para-hs256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
app.resource-id.secret=${RESOURCE_ID_SECRET:7mP9!qL2#vN8@xD4$kR6^tY1&hJ5*eF3!uW0@pS8#zQ2}

app.cors.enabled=${CORS_ENABLED:true}
app.cors.path-pattern=${CORS_PATH_PATTERN:/api/**}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

app.arquivos.dir=${APP_ARQUIVOS_DIR:${user.dir}/arquivos}
