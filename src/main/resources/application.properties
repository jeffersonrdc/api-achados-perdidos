spring.application.name=api-achados-perdidos

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=America/Sao_Paulo

server.port=8080
server.servlet.context-path=/

# Endurecimento do handler de erro do Spring Boot (relatório XPTO M-04): nenhuma
# informação de diagnóstico interna (stacktrace, mensagem de exceção, tipo, erros de
# binding) deve ser devolvida ao cliente. O detalhamento completo fica só no log do
# servidor via GlobalExceptionHandler. São os defaults do Boot, fixados aqui de forma
# explícita para evitar regressão e satisfazer o critério de aceite do relatório.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Health check para container/orquestrador e load balancer. Expõe SOMENTE o endpoint
# /actuator/health (nenhum outro endpoint de gestão), sem detalhes de diagnóstico
# (relatório XPTO M-04 / A05). O /actuator/health é liberado sem autenticação no
# SecurityConfig; os demais endpoints de management permanecem inacessíveis.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

# Confiança em headers de proxy reverso (X-Forwarded-For/Proto): NATIVE delega ao
# Tomcat (RemoteIpValve), que só honra o XFF vindo de proxies internos confiáveis —
# assim getRemoteAddr() reflete o IP real do cliente sem aceitar spoofing (A07/A09).
# Use NONE para desligar (ex.: sem proxy à frente).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NATIVE}

# Até 5 comprovantes de 10 MB na retirada pública (ou 5 imagens de 5 MB em respostas).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:52MB}

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:achados_perdidos}?useSSL=false&serverTimezone=America/Sao_Paulo&tinyInt1isBit=false}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Documentação da API (Swagger/OpenAPI): desligue em produção com SPRINGDOC_ENABLED=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.urls-primary-name=01 — Painel Administrativo
springdoc.packages-to-scan=br.com.achadosperdidos.controller
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.show-actuator=false

# Segredos SEM default: a aplicação NÃO sobe se JWT_SECRET/RESOURCE_ID_SECRET
# não forem definidos no ambiente (fail-fast — A02/A05).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
app.resource-id.secret=${RESOURCE_ID_SECRET:}

# Proteção a força-bruta no login (A07) — Bucket4j in-app.
app.security.login-rate-limit.enabled=${LOGIN_RATE_LIMIT_ENABLED:true}
# Tentativas por IP em janela de 1 minuto.
app.security.login-rate-limit.ip-per-minute=${LOGIN_RATE_LIMIT_IP_PER_MINUTE:30}
# Tentativas por conta antes do bloqueio temporário.
app.security.login-rate-limit.account-attempts=${LOGIN_RATE_LIMIT_ACCOUNT_ATTEMPTS:5}
# Janela do bloqueio por conta, em minutos.
app.security.login-rate-limit.account-window-minutes=${LOGIN_RATE_LIMIT_ACCOUNT_WINDOW_MINUTES:15}

# Anti-abuso dos endpoints públicos do portal (claims, crianças, registro) — A04/A07.
app.security.public-rate-limit.enabled=${PUBLIC_RATE_LIMIT_ENABLED:true}
# Requisições por IP, por ação, em janela de 1 minuto.
app.security.public-rate-limit.per-minute=${PUBLIC_RATE_LIMIT_PER_MINUTE:12}
# Teto por ação (sobrepõe o padrão acima). Leitura de imagem tem outra natureza: uma
# página de catálogo dispara ~20 GETs de miniatura e, com a CDN em cache frio, todos
# chegam à origem — 12/min faria o próprio usuário tomar 429 navegando normalmente.
app.security.public-rate-limit.acoes.portal-foto=${PUBLIC_RATE_LIMIT_FOTO_PER_MINUTE:120}

app.cors.enabled=${CORS_ENABLED:true}
app.cors.path-pattern=${CORS_PATH_PATTERN:/**}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

app.arquivos.dir=${APP_ARQUIVOS_DIR:${user.dir}/arquivos}

# AWS S3 — credenciais via DefaultCredentialsProvider (env/IAM/profile). Não gravar secrets no banco.
app.s3.enabled=${APP_S3_ENABLED:true}
app.s3.bucket=${APP_S3_BUCKET:}
app.s3.region=${APP_S3_REGION:us-east-1}
app.s3.prefix=${APP_S3_PREFIX:}
app.s3.endpoint=${APP_S3_ENDPOINT:}
app.s3.path-style-access=${APP_S3_PATH_STYLE:false}

# URL pública do portal (CTA dos e-mails). Vazio = deriva do host da requisição; localhost só como último fallback.
app.portal.base-url=${PORTAL_BASE_URL:}

# IP real do cliente atrás de CDN. Com CloudFront na frente, o XFF chega como
# "<viewer>, <edge>" e o RemoteIpValve para no IP público do edge — todos os usuários
# passam a dividir o mesmo balde de rate limit e a auditoria grava o IP errado.
# Defina com o header que a CDN sobrescreve (produção AWS: CloudFront-Viewer-Address).
# Vazio = usa getRemoteAddr() (comportamento para ambiente sem CDN).
# ATENÇÃO: só habilite quando a origem for alcançável APENAS através da CDN.
app.security.client-ip.trusted-header=${CLIENT_IP_TRUSTED_HEADER:}

# Cache positivo nos GETs públicos do portal (para a CDN absorver pico de catálogo).
# false = todo GET público volta a responder no-store, como antes desta política existir.
# Use false em ambiente SEM CDN (ex.: DEV, onde o cache do navegador atrasaria ver um
# cadastro recém-alterado) ou como alavanca de emergência, sem deploy de código.
app.cache.public-json.enabled=${PUBLIC_JSON_CACHE_ENABLED:true}

# TTL das fotos públicas do portal na CDN (/portal/arquivos/{id}/download e /thumbnail).
# Os bytes de um ID nunca mudam, mas o arquivo pode deixar de ser público (exclusão,
# moderação, item reclamado) sem que a CDN saiba. Enquanto não houver invalidação
# automática no CloudFront, reduzir este valor é o controle disponível.
app.cache.arquivo-publico-max-age-seconds=${ARQUIVO_PUBLICO_MAX_AGE:86400}
