app.jwt.secret=chave-secreta-minimo-32-chars-para-hs256-testes
app.jwt.expiration-ms=86400000
app.jwt.refresh.expiration-ms=2592000000
app.resource-id.secret=7mP9!qL2#vN8@xD4$kR6^tY1&hJ5*eF3!uW0@pS8#zQ2-testes
app.arquivos.dir=${java.io.tmpdir}/achados-perdidos-test/arquivos
app.s3.enabled=true
app.s3.bucket=achados-perdidos-test
app.s3.region=us-east-1
app.s3.in-memory=true
springdoc.api-docs.path=/api-docs

# Rate limiting desligado nos testes: vários logins pelo mesmo IP do MockMvc
# não devem tropeçar na proteção de força-bruta.
app.security.login-rate-limit.enabled=false

# Idem para o anti-abuso do portal: o MockMvc usa sempre a mesma origem e várias
# chamadas públicas na mesma suíte não devem esbarrar no limite por IP.
app.security.public-rate-limit.enabled=false
