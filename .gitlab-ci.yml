# GitLab CI/CD — rockinrio/backend
# Runners: use a tag `deploy` no(s) runner(s) responsáveis pelo build/deploy.
# Branches: `develop` → ambiente de desenvolvimento | `main` → produção.

default:
  image:
    name: docker:24-cli
    pull_policy: if-not-present

stages:
  - build
  - test
  - security
  - deploy

variables:
  DEPLOY_DIR: "/opt/rockinrio-backend"
  COMPOSE_PROJECT_NAME: "rockinrio-backend"
  IMAGE_CI: "rockinrio-backend:ci-${CI_COMMIT_SHORT_SHA}"

.branch_main_develop: &branch_main_develop
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:
  stage: build
  tags:
    - deploy
  <<: *branch_main_develop
  script:
    - docker build -t "${IMAGE_CI}" .
    # Extrai o fat-jar para o SCA (Trivy) escanear offline, sem resolver o Maven Central.
    - docker rm -f "ci-extract-${CI_JOB_ID}" >/dev/null 2>&1 || true
    - docker create --name "ci-extract-${CI_JOB_ID}" "${IMAGE_CI}"
    - docker cp "ci-extract-${CI_JOB_ID}:/app/app.jar" ./app.jar
    - docker rm -f "ci-extract-${CI_JOB_ID}" >/dev/null 2>&1 || true
  artifacts:
    paths:
      - app.jar
    expire_in: 1 hour

test:
  stage: test
  tags:
    - deploy
  needs:
    - build
  <<: *branch_main_develop
  variables:
    # Porta de host alternativa: a VPS já usa a 3306 para o banco da aplicação.
    IT_MYSQL_PORT: "13306"
  script:
    # Gate de teste REAL: a suíte de integração conecta ao banco e, sem ele, os testes
    # seriam PULADOS (assumeTrue) — o gate não validaria nada. Subimos um MySQL efêmero
    # numa porta livre e usamos --network host para o `RUN mvn test` do build alcançá-lo.
    - docker rm -f "it-mysql-${CI_JOB_ID}" >/dev/null 2>&1 || true
    - docker run -d --name "it-mysql-${CI_JOB_ID}"
        -e MYSQL_ALLOW_EMPTY_PASSWORD=1
        -e MYSQL_DATABASE=achados_perdidos_it
        -p ${IT_MYSQL_PORT}:3306 mysql:8.0 --default-authentication-plugin=mysql_native_password
    - echo "Aguardando o MySQL aceitar conexões..."
    - for i in $(seq 1 40); do docker exec "it-mysql-${CI_JOB_ID}" mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1 && break; sleep 2; done
    - docker build --target test --network host
        --build-arg TEST_DB_URL="jdbc:mysql://127.0.0.1:${IT_MYSQL_PORT}/achados_perdidos_it?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
        -t "rockinrio-backend-test:${CI_COMMIT_SHORT_SHA}" .
  after_script:
    - docker rm -f "it-mysql-${CI_JOB_ID}" >/dev/null 2>&1 || true

# =====================================================================================
# Estágio de segurança (A05/A06/A08) — "avaliação contínua de risco".
# Todos os jobs rodam em PARALELO e são allow_failure:true (VISÍVEIS, mas NÃO bloqueiam
# o deploy). Após a primeira triagem de findings, transforme cada um em GATE bloqueante
# removendo `allow_failure: true` do job desejado.
# =====================================================================================

# A06 — Software Composition Analysis: CVEs conhecidos nas dependências.
sca_dependencias:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags:
    - deploy
  needs:
    - build
  <<: *branch_main_develop
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy --version
    # Escaneia o fat-jar (deps embarcadas) — offline, sem resolver o Maven Central
    # (evita o 429 de rate-limit). --exit-code 1 deixa o job vermelho quando há
    # HIGH/CRITICAL; como é allow_failure, não bloqueia. Remova allow_failure p/ bloquear.
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table app.jar
  allow_failure: true

# A05/A08 — SAST: análise estática do código-fonte (padrões inseguros).
sast_semgrep:
  stage: security
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  tags:
    - deploy
  needs:
    - build
  <<: *branch_main_develop
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    - semgrep --version
    # Regras públicas para Java, segredos e OWASP Top 10. --error faz o job falhar
    # quando há achados (visível; não bloqueia por causa do allow_failure).
    # missing-user (rodar como root) é EXCLUÍDO por ora: o compose faz bind-mount de
    # ./arquivos; rodar como não-root exige ajustar a permissão do volume no servidor.
    - semgrep scan --error
        --config "p/java" --config "p/secrets" --config "p/owasp-top-ten"
        --exclude-rule dockerfile.security.missing-user.missing-user .
  allow_failure: true

# Detecção de segredos commitados (chaves, tokens, senhas).
secret_detection:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  tags:
    - deploy
  needs:
    - build
  <<: *branch_main_develop
  script:
    - gitleaks version
    # --config: allowlist de falsos-positivos (arquivos .example e placeholders).
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
  allow_failure: true

.deploy_template: &deploy_template
  stage: deploy
  before_script:
    - |
      if ! command -v rsync >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache rsync
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq rsync
        else
          echo "ERRO - rsync não encontrado" && exit 1
        fi
      fi
  script:
    - echo "Publicando commit ${CI_COMMIT_SHORT_SHA} em ${DEPLOY_DIR}"
    - mkdir -p "${DEPLOY_DIR}"
    - rsync -a --delete --no-owner --no-group --exclude .env --exclude .git --exclude target --exclude arquivos --exclude paineladmin --exclude portalpublico ./ "${DEPLOY_DIR}/"
    - cd "${DEPLOY_DIR}"
    - test -f .env || (echo "ERRO - crie .env em ${DEPLOY_DIR} antes do primeiro deploy" && exit 1)
    - docker compose down --remove-orphans --timeout 30 || true
    - docker rm -f rockinrio-backend 2>/dev/null || true
    - docker compose up -d --build --remove-orphans --force-recreate
    - docker compose ps
    - chmod +x scripts/ci-docker-cleanup.sh
    - IMAGE_CI="${IMAGE_CI}" sh scripts/ci-docker-cleanup.sh

deploy_development:
  <<: *deploy_template
  resource_group: rockinrio-backend-dev
  tags:
    - deploy
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: development
    url: https://rockinrio-backend.mastersdevs.com.br/swagger-ui.html

deploy_production:
  <<: *deploy_template
  resource_group: rockinrio-backend-prod
  tags:
    - deploy
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
